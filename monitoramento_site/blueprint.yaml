blueprint:
  name: Monitoramento Inteligente de Site (Ping)
  description: >
    Verifica se um site está online em intervalos configuráveis. 
    Realiza retestes antes de notificar falha para evitar alarmes falsos.
  domain: automation
  input:
    site_entity:
      name: Sensor de Ping
      description: Selecione o binary_sensor do site.
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: Intervalo de Verificação (Horas)
      description: Frequência em horas para realizar o ping.
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notify_service:
      name: Serviço de Notificação
      description: "Exemplo: notify.mobile_app_seu_celular"
      selector:
        text: # Mudamos para texto simples ou seletor de serviço para evitar a caixa de mensagem duplicada
          multiline: false
    alert_title:
      name: Título do Alerta
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: Mensagem do Alerta
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/{{ input_check_interval }}"

variables:
  input_check_interval: !input check_interval
  # Transformamos o input em variável para usar no service call
  service_target: !input notify_service

actions:
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Aqui usamos a variável do serviço com os dados fixos abaixo
              - action: "{{ service_target }}"
                data:
                  title: !input alert_title
                  message: !input alert_message
    else:
      - stop: "Site online."
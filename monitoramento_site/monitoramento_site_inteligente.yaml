blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Monitoramento com reteste. Suporta seleção de celular e entrada manual para TV/Telegram."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo (Horas)"
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notify_device:
      name: "Celular (Opcional)"
      description: "Selecione o seu smartphone na lista."
      default: ""
      selector:
        device:
          integration: mobile_app
    notify_manual:
      name: "Outros Serviços (Opcional)"
      description: "Digite manualmente (ex: notify.lg_webos_smart_tv). Adicione vários se precisar."
      default: []
      selector:
        text:
          multiple: true
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/{{ input_check_interval }}"

variables:
  input_check_interval: !input check_interval
  device_id: !input notify_device
  manual_notifiers: !input notify_manual
  title: !input alert_title
  message: !input alert_message

actions:
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # 1. Envia para o Celular (se selecionado)
              - if:
                  - "{{ device_id != '' }}"
                then:
                  - action: notify.mobile_app_{{ device_attr(device_id, 'name') | slugify }}
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
              
              # 2. Envia para os manuais (se houver algum)
              - repeat:
                  for_each: "{{ manual_notifiers }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ title }}"
                        message: "{{ message }}"
    else:
      - stop: "Site online."
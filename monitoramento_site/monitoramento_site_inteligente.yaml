blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Verifica se um site está online e retesta antes de notificar. Escolha o serviço de notificação na lista sem duplicar campos."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      description: "Selecione o binary_sensor do site."
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo de Verificação (Horas)"
      description: "Frequência em horas para realizar o ping."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notify_service:
      name: "Serviço de Notificação"
      description: "Selecione o serviço de destino (Celular, TV, etc). Não se preocupe com os campos de texto aqui, use os campos abaixo."
      selector:
        service: {} # Isso abre apenas a lista de serviços sem os campos de dados
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/{{ input_check_interval }}"

variables:
  input_check_interval: !input check_interval
  chosen_service: !input notify_service

actions:
  # 1. Força atualização
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  # 2. Lógica de reteste
  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Executa o serviço selecionado com os textos do Blueprint
              - action: !input notify_service
                data:
                  title: !input alert_title
                  message: !input alert_message
    else:
      - stop: "Site online."
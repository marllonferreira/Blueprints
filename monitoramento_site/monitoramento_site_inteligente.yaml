blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Monitoramento com reteste. Digite os serviços de notificação manualmente."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo de Verificação (Horas)"
      default: 1
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notifiers:
      name: "Serviços de Notificação"
      description: "Digite o nome exato (ex: notify.mobile_app_celular). Clique em 'Adicionar item' para mais de um."
      default: []
      selector:
        text:
          multiple: true
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

# Gatilho simplificado que o HA aceita sem erro de "malformed"
trigger:
  - platform: time_pattern
    hours: "/1"

variables:
  # Pegando os inputs
  var_interval: !input check_interval
  var_notifiers: !input notifiers

actions:
  # Só executa se a hora atual for múltipla do intervalo (ex: se for 1h, roda sempre)
  - condition: template
    value_template: "{{ (now().hour % (var_interval | int)) == 0 }}"

  # 1. Primeira verificação
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Envia para cada serviço digitado no campo manual
              - repeat:
                  for_each: "{{ var_notifiers }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: !input alert_title
                        message: !input alert_message
    else:
      - stop: "Site online."
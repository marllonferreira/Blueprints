blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Verifica se um site está online em intervalos configuráveis e realiza retestes antes de notificar falha."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      description: "Selecione o binary_sensor do site."
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo de Verificação (Horas)"
      description: "Frequência em horas para realizar o ping."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notify_target:
      name: "Dispositivo de Notificação"
      description: "Selecione o celular ou TV para receber o alerta."
      selector:
        target:
          entity:
            - domain: notify
            - integration: mobile_app
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/{{ input_check_interval }}"

variables:
  input_check_interval: !input check_interval
  # Captura o alvo selecionado
  notify_target_var: !input notify_target

actions:
  # 1. Primeira verificação
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      # Primeiro Reteste após 2 minutos
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          # Segundo Reteste após mais 2 minutos
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Notificação Final
              # Usamos notify.send_message que é o padrão universal atual
              - action: notify.send_message
                target: !input notify_target
                data:
                  title: !input alert_title
                  message: !input alert_message
    else:
      - stop: "Site online."
blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Monitoramento com reteste. Suporta seleção de celular e entrada manual para TV/Telegram."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo (Horas)"
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notify_device:
      name: "Celular (Opcional)"
      description: "Selecione o seu smartphone na lista."
      default: ""
      selector:
        device:
          integration: mobile_app
    notify_manual:
      name: "Outros Serviços (Opcional)"
      description: "Digite manualmente (ex: notify.lg_webos_smart_tv). Adicione vários se precisar."
      default: []
      selector:
        text:
          multiple: true
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

# Usando template no trigger para evitar o erro de time_pattern
trigger:
  - platform: template
    value_template: "{{ (now().hour % (states('input.check_interval') | default(12) | int)) == 0 and now().minute == 0 and now().second == 0 }}"
    # Se o template acima for complexo para o blueprint, usamos a forma clássica corrigida abaixo:
  - platform: time_pattern
    hours: "*" # Deixamos rodar toda hora e filtramos na condição para evitar o erro de validação do HA

action:
  # Filtro para rodar apenas no intervalo escolhido
  - condition: template
    value_template: "{{ (now().hour % (check_interval | int)) == 0 }}"
  
  # 1. Primeira verificação
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Envio para Celular
              - if:
                  - condition: template
                    value_template: "{{ device_id != '' }}"
                then:
                  - action: notify.mobile_app_{{ device_attr(device_id, 'name') | slugify }}
                    data:
                      title: !input alert_title
                      message: !input alert_message
              
              # Envio para Manuais (TV/Telegram)
              - repeat:
                  for_each: !input notify_manual
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: !input alert_title
                        message: !input alert_message
    else:
      - stop: "Site online."

variables:
  # Definindo variáveis para usar nos templates
  check_interval: !input check_interval
  device_id: !input notify_device
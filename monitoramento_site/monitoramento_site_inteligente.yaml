blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Verifica se um site está online e realiza retestes. Digite manualmente os serviços de notificação."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      description: "Selecione o binary_sensor do site."
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo de Verificação (Horas)"
      description: "A cada quantas horas o sistema deve checar o site."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notifiers:
      name: "Serviços de Notificação"
      description: "Digite o nome exato do serviço (ex: notify.mobile_app_celular ou notify.lg_webos_smart_tv). Use 'Adicionar item' para múltiplos."
      default: []
      selector:
        text:
          multiple: true
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

# Gatilho simplificado para evitar o erro de validação (roda a cada hora e a condição filtra)
trigger:
  - platform: time_pattern
    hours: "/1"

variables:
  # Transforma os inputs em variáveis
  var_interval: !input check_interval
  var_notifiers: !input notifiers
  var_title: !input alert_title
  var_message: !input alert_message

action:
  # CONDIÇÃO: Só continua se a hora atual for divisível pelo intervalo escolhido
  - condition: template
    value_template: "{{ (now().hour % (var_interval | int)) == 0 }}"

  # 1. Força a atualização do Ping
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  # 2. Lógica de reteste (Se o estado for 'off')
  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Envia para cada serviço digitado manualmente
              - repeat:
                  for_each: "{{ var_notifiers }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ var_title }}"
                        message: "{{ var_message }}"
    else:
      - stop: "Site online."
blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Verifica se um site está online em intervalos configuráveis. Realiza retestes antes de notificar falha."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      description: "Selecione o binary_sensor do site."
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo de Verificação (Horas)"
      description: "Frequência em horas para realizar o ping (ex: /6, /12)."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notify_action:
      name: "Dispositivo de Notificação"
      description: "Clique em 'Chamar Serviço' e escolha seu celular (notify.mobile_app) ou TV (notify.lg_webos)."
      selector:
        action: {} # Isso abre o seletor padrão que você conhece, que é o único que enxerga a TV e Celular perfeitamente.
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/{{ input_check_interval }}"

variables:
  input_check_interval: !input check_interval
  # Capturamos o título e mensagem para injetar na ação escolhida
  custom_title: !input alert_title
  custom_message: !input alert_message

actions:
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Aqui está a mágica: ele executa a ação que você escolheu (Celular/TV)
              # mas injeta os dados de Título e Mensagem que você definiu no Blueprint.
              - choose: []
                default: !input notify_action
              # O código abaixo força a sobreposição dos dados para garantir que use o seu texto
              - action: !input notify_action
                data:
                  title: "{{ custom_title }}"
                  message: "{{ custom_message }}"
    else:
      - stop: "Site online."
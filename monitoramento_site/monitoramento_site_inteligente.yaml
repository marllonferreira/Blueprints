blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Verifica se um site está online e retesta antes de notificar. Permite escolher múltiplos dispositivos de notificação de uma vez."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      description: "Selecione o binary_sensor do site."
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo de Verificação (Horas)"
      description: "Frequência em horas para realizar o ping."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notifiers:
      name: "Dispositivos de Notificação"
      description: "Selecione todos os dispositivos que devem receber o alerta (Celular, TV, etc)."
      selector:
        entity:
          multiple: true # ISSO permite escolher vários e não abre campos de texto!
          filter:
            - domain: notify
            - integration: mobile_app
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/{{ input_check_interval }}"

variables:
  # Pegamos a lista de entidades selecionadas
  notifiers: !input notifiers
  alert_title: !input alert_title
  alert_message: !input alert_message
  input_check_interval: !input check_interval

actions:
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Loop para enviar para cada dispositivo selecionado
              - repeat:
                  for_each: "{{ notifiers }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ alert_title }}"
                        message: "{{ alert_message }}"
    else:
      - stop: "Site online."
blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Verifica se um site está online e retesta antes de notificar. Digite os serviços de notificação manualmente para evitar campos duplicados."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      description: "Selecione o binary_sensor do site."
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo de Verificação (Horas)"
      description: "Frequência em horas para realizar o ping."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notifiers:
      name: "Serviços de Notificação"
      description: "Digite os serviços (ex: notify.mobile_app_celular). Use a opção 'Adicionar item' para colocar vários."
      selector:
        text:
          multiple: true # Permite adicionar uma lista de nomes manualmente
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/{{ input_check_interval }}"

variables:
  # Captura as entradas do usuário
  notifiers_list: !input notifiers
  custom_title: !input alert_title
  custom_message: !input alert_message
  input_check_interval: !input check_interval

actions:
  # 1. Força a atualização do Ping
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  # 2. Lógica de reteste (3 tentativas no total)
  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Loop para enviar para cada serviço que você digitou
              - repeat:
                  for_each: "{{ notifiers_list }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ custom_title }}"
                        message: "{{ custom_message }}"
    else:
      - stop: "Site online. Nenhuma ação necessária."
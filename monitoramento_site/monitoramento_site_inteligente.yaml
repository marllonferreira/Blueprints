blueprint:
  name: "Monitoramento Inteligente de Site (Ping)"
  description: "Verifica se um site está online e retesta antes de notificar. Digite manualmente os serviços de notificação para total compatibilidade."
  domain: automation
  input:
    site_entity:
      name: "Sensor de Ping"
      description: "Selecione o binary_sensor do site."
      selector:
        entity:
          domain: binary_sensor
          device_class: connectivity
    check_interval:
      name: "Intervalo de Verificação (Horas)"
      description: "Frequência em horas para realizar o ping."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    notifiers:
      name: "Serviços de Notificação (Manual)"
      description: "Digite o nome exato do serviço. Use 'Adicionar item' para múltiplos (ex: notify.mobile_app_celular)."
      selector:
        text:
          multiple: true # Permite o botão de "+" para adicionar vários manualmente
    alert_title:
      name: "Título do Alerta"
      default: "⚠️ Alerta de Site Offline"
      selector:
        text:
    alert_message:
      name: "Mensagem do Alerta"
      default: "O site falhou em todas as tentativas e parece estar fora do ar."
      selector:
        text:

mode: restart

trigger:
  - platform: time_pattern
    hours: "/{{ input_check_interval }}"

variables:
  # Transforma os inputs em variáveis para a lógica
  notifiers_list: !input notifiers
  custom_title: !input alert_title
  custom_message: !input alert_message
  input_check_interval: !input check_interval

actions:
  # 1. Força a atualização do Ping
  - action: homeassistant.update_entity
    target:
      entity_id: !input site_entity

  # 2. Lógica de reteste
  - if:
      - condition: state
        entity_id: !input site_entity
        state: "off"
    then:
      - delay: "00:02:00"
      - action: homeassistant.update_entity
        target:
          entity_id: !input site_entity
      
      - if:
          - condition: state
            entity_id: !input site_entity
            state: "off"
        then:
          - delay: "00:02:00"
          - action: homeassistant.update_entity
            target:
              entity_id: !input site_entity
          
          - if:
              - condition: state
                entity_id: !input site_entity
                state: "off"
            then:
              # Loop que percorre a lista de nomes que você digitou
              - repeat:
                  for_each: "{{ notifiers_list }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ custom_title }}"
                        message: "{{ custom_message }}"
    else:
      - stop: "Site online."